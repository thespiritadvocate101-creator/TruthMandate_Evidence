name: Forensic Audit Ledger Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run JSON Structure & Schema Validation
        run: python scripts/validate_ledger.py

      - name: Run Spatial & Cadastral Integrity Check
        run: python scripts/validate_spatial.py
